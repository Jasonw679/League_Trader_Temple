<article class="riftbound-card" [routerLink]="['/card', card.id]">
  <img [src]="card.imageThumb.large || card.image" [alt]="card.name" />
  <div class="card-copy">
    <p class="card-code">{{ card.id | uppercase }}</p>
    <h2>{{ card.name }}</h2>
    <p>{{ card.rarity | titlecase }} {{ card.type }}</p>
    <p *ngIf="card.faction" class="domain-list">{{ card.faction | titlecase }}</p>
    <p>Not Available</p>
  </div>
</article>
