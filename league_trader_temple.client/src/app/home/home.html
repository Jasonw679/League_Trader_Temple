<main class="card-browser">
  <section class="browser-toolbar" aria-labelledby="card-browser-title">
    <div>
      <h1 id="card-browser-title">Top Cards</h1>
    </div>
  </section>

  <p *ngIf="isLoadingCards()" class="status-text">Loading cards...</p>
  <p *ngIf="cardLoadError()" class="error-text">{{ cardLoadError() }}</p>

  <section class="card-horizontal" aria-label="Riftbound cards">
    <span *ngFor="let card of cards()">
      <app-card [card]="card"></app-card>
    </span>
  </section>
</main>
