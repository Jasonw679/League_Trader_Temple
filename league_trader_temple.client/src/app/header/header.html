<div style="display:flex; align-items:center; justify-content:space-between; width:100%; padding:8px 16px;">
  <img alt="League Trader Temple Logo" width="400" height="40" style="object-fit:contain;">
  <form class="search-form" (submit)="$event.preventDefault(); searchCards()">
    <label for="card-search">Search cards</label>
    <div class="search-row">
      <input id="card-search"
             type="search"
             [value]="searchTerm()"
             (input)="onSearchInput($event)"
             placeholder="Name, set, keyword" />
      <button type="submit">Search</button>
    </div>
  </form>
  <span style="font-size:14px; color:#fff; text-align:right;">Account (coming soon)</span>
</div>

<div  style="background:#000; color:#fff; width:100%; height: 30px">
  <a href="/" role="button" style="background: #000; color:#fff; padding:6px 12px; font-size:14px; cursor:pointer;">
    Home
  </a>
</div>
