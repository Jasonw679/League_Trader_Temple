<div style="display:flex; align-items:center; justify-content:space-between; width:100%; padding:8px 16px;">
  <a href="/">
    <img src="League Trader Temple.png" alt="League Trader Temple Logo" style="width:100px; height:100px; object-fit:contain;">
  </a>
  <form class="search-form" (submit)="$event.preventDefault(); searchCards()">
    <label for="card-search">Search cards</label>   
    <div class="search-row">
      <input id="card-search"
             type="search"
             [value]="searchTerm()"
             (input)="onSearchInput($event)"
             placeholder="Name, set, keyword" />
      <button type="submit">Search</button>
    </div>
  </form>
  <div style="display:flex; align-items:flex-end;">
    <a href="/shoppingcart">
      <img src="Cart.png" alt="Shopping Cart" />
    </a>

    <span *ngIf="!auth.isLoggedIn()">
      <a href="/login" role="button" style="background: #000; color:#fff; padding:6px 12px; font-size:14px; cursor:pointer;">
        Login
      </a>
      <span style="font-size:14px; color:#fff; text-align:right;">Create an Account (coming soon)</span>
    </span>
    <span *ngIf="auth.currentUser$ | async as currentUser">
      Welcome {{ currentUser.username }}
      <a (click)="auth.logout()">
        Logout
      </a>
    </span>
  </div>
  
</div>

<div  style="background:#000; color:#fff; width:100%; height: 30px">
  <a href="/" role="button" style="background: #000; color:#fff; padding:6px 12px; font-size:14px; cursor:pointer;">
    Home
  </a>
</div>
