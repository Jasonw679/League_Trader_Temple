<form (ngSubmit)="onLoginSubmit()">
  <div *ngIf="errorMessage != ''" style="color: red;">
    {{errorMessage}}
  </div>
  <div>
    <label>Username:</label>
    <input type="text"
           id="username"
           name="username"
           [(ngModel)]="username"
           required/>
  </div>

  <div>
    <label>Password:</label>
    <input type="password"
           id="password"
           name="password"
           [(ngModel)]="password"
           required/>
  </div>
  <button type="submit">Login</button>
</form>
<div>
  <a routerLink="/create-account">
    Create an Account
  </a>
</div>
