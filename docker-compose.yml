services:
  league-trader-temple:
    build:
      context: .
      dockerfile: League_Trader_Temple.Server/Dockerfile
    image: league-trader-temple:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Cards: Host=postgres;Port=5432;Database=league_trader_temple;Username=postgres;Password=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: league_trader_temple
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
